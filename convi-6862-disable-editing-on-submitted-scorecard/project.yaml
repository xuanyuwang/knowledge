notes: Backend is merged with `submitted_scorecard_editors` / `submittedScorecardEditors` as a `users + teams + groups` contract. Frontend exposes the control in `TemplateBuilderAdvanced`, round-trips users/teams/groups, does not depend on `permissions.scorecardGraders`, and uses `All users` as the empty-state text. `director#19805` merged the `EvaluateScorecardsPermissions` client wrapper and hook; PR `director#19100` should now use that hook to proactively lock denied submitted scorecards on load. CONVI-7350 is implemented on `go-servers-convi-7350` so write enforcement loads the latest template revision for authorization while preserving pinned revisions for scoring.
