notes: >-
  Cross-page contracts live at the parent or shared-analytics-platform level. RetrieveHintStats now has a canonical API reference, including the independent action/moment annotation schemas, application-level adherence link, query stages, and integrity caveat. Assistance Insights is a first-class subdomain. Legacy folders retain raw ticket and execution evidence. INSI-4262 is diagnosed as a long-session false-negative introduced by the June 10 per-message labeler; open go-servers PR #32443 restores true interval overlap and directly covers the confirmed Bill cases, with merge/deploy and historical re-label remaining. CONVI-7387 fixes the Heartland Behavioral Hints mixed-unit aggregation in go-servers PR #30782 by counting followed actions instead of followed moments. CONVI-7384 is diagnosed at the data level as scorecard-time versus submit-time plus frequency-boundary membership; instrumented confirmation pending. CONVI-7385 filter-parity fix is in draft Director PR #21214 with lint, type checking, and commit hooks passing; manual CNG validation remains. CONVI-7402 PR #31335 merged and fixes the QA paths; CONVI-7706 is in review in go-servers PR #32440 for the remaining Bswift `RetrieveConversationStats` regression. CONVI-7708 tracks value-or-missing parity for the nine Assistance Insights RPCs with a confirmed Director contract, while other shared callers retain explicit rejection pending contract decisions. CONVI-7667 is diagnosed as a Director request-construction regression: the default conversation-ended target removes standalone process scorecards even when PG and CH agree. CONVI-7681 tracks urgent RCG analytics tail latency; the captured calls spend 47-50 seconds in server wait, while reindex/write load and cache opt-out remain unproven hypotheses.
