notes: Current director/main Manager Leaderboard uses RetrieveQAScoreStats and RetrieveQAConversations for Scorecards completed, grouped/filtered by scorecard submitter. That QA path filters and groups time by scorecard_time via the conversation-start target, not by scorecard_submit_time. The older RetrieveScorecardStats path intentionally rewrote scorecard_time to scorecard_submit_time. This is the leading explanation for CONVI-7162 daily redistribution/missing counts versus QM/Coaching Hub submitted scorecard counts.
